spring.application.name=fintrack

# Local file database (created in ./data). Use the "postgres" profile for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/fintrack;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT signing secret: set JWT_SECRET (32+ characters) outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiry-hours=12

# Owner account created on first start if no owner exists. Change the password after first login.
app.owner.username=${OWNER_USERNAME:owner}
app.owner.email=${OWNER_EMAIL:owner@fintrack.local}
app.owner.password=${OWNER_PASSWORD:ChangeMe123!}

# Sign-in lockout: this many wrong passwords start a lock of this length. One more failure
# after the lock ends locks the account until an administrator unlocks it.
app.security.max-login-attempts=4
app.security.lockout-minutes=10

# Bill reminders: how many days ahead to warn, and when the daily check runs.
app.notifications.bill-due-days=3
app.notifications.cron=0 0 8 * * *
